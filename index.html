<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Transmisión Web</title>
    <!-- Librería para reproducir FLV/HTTP Live Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #00d26a;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .main-container {
            width: 100%;
            max-width: 900px;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls-bar {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-live {
            background-color: #00d26a;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-live:hover {
            background-color: #00b359;
        }
        .status-badge {
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Servidor de Retransmisión</h1>

    <div class="main-container">
        <div class="player-wrapper">
            <video id="videoElement" controls autoplay muted></video>
        </div>

        <div class="controls-bar">
            <button class="btn-live" onclick="conectarStream()">🔴 Conectar Transmisión</button>
            <span id="status" class="status-badge">Estado: Desconectado</span>
        </div>
    </div>

    <script>
        function conectarStream() {
            const statusText = document.getElementById('status');
            
            if (mpegts.getFeatureStatus().isSupported) {
                const videoElement = document.getElementById('videoElement');
                
                // Reemplaza esta URL por la que te dio Render
                const streamUrl = 'https://TU-SERVICIO.onrender.com/live/stream.flv';

                statusText.innerText = 'Estado: Conectando...';
                statusText.style.color = '#e5a93c';

                const player = mpegts.createPlayer({
                    type: 'flv',
                    isLive: true,
                    url: streamUrl
                });
                
                player.attachMediaElement(videoElement);
                player.load();
                player.play();

                player.on(mpegts.Events.ERROR, (err) => {
                    statusText.innerText = 'Estado: Error al cargar transmisión';
                    statusText.style.color = '#ff4d4d';
                });

                statusText.innerText = 'Estado: Transmitiendo en Vivo';
                statusText.style.color = '#00d26a';
            } else {
                alert('Tu navegador no soporta el reproductor mpegts.');
            }
        }
    </script>
</body>
</html>
