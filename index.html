<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Retransmisión RTMP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }
        .section {
            background-color: #0f172a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
        }
        .section h2 {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .field { margin-bottom: 12px; }
        .field:last-child { margin-bottom: 0; }
        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background-color: #22c55e;
            color: #000;
        }
        .btn-start:hover { background-color: #16a34a; }
        .btn-stop {
            background-color: #ef4444;
            color: #fff;
        }
        .btn-stop:hover { background-color: #dc2626; }
        .status-bar {
            margin-top: 16px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Control de Retransmisión</h1>

        <!-- Datos de conexion para OBS -->
        <div class="section">
            <h2>1. Configuración para OBS Studio</h2>
            <div class="field">
                <label>Servidor RTMP:</label>
                <input type="text" id="obsServer" readonly value="rtmp://TU-SERVICIO.onrender.com/live">
            </div>
            <div class="field">
                <label>Clave de Transmisión:</label>
                <input type="text" id="obsKey" readonly value="stream">
            </div>
        </div>

        <!-- Datos del destino / Red Social -->
        <div class="section">
            <h2>2. Destino (Red Social / Plataforma)</h2>
            <div class="field">
                <label>URL del Servidor RTMP Destino:</label>
                <input type="text" id="targetServer" placeholder="ej. rtmp://a.rtmp.youtube.com/live2">
            </div>
            <div class="field">
                <label>Clave de Transmisión Destino:</label>
                <input type="password" id="targetKey" placeholder="Pega tu clave de YouTube/Twitch">
            </div>
        </div>

        <!-- Botones de Control -->
        <div class="btn-group">
            <button class="btn-start" onclick="toggleStream(true)">START STREAM</button>
            <button class="btn-stop" onclick="toggleStream(false)">STOP STREAM</button>
        </div>

        <div id="status" class="status-bar">Estado: Listo para configurar</div>
    </div>

    <script>
        // Actualiza el campo de OBS con tu URL de Render automáticamente si deseas
        const RENDER_URL = 'https://TU-SERVICIO.onrender.com';

        async function toggleStream(action) {
            const statusDiv = document.getElementById('status');
            const targetServer = document.getElementById('targetServer').value.trim();
            const targetKey = document.getElementById('targetKey').value.trim();

            if (action && (!targetServer || !targetKey)) {
                alert('Por favor ingresa el servidor RTMP y la clave de la red social.');
                return;
            }

            statusDiv.innerText = action ? 'Iniciando retransmisión...' : 'Deteniendo retransmisión...';

            try {
                const response = await fetch(`${RENDER_URL}/api/relay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        active: action,
                        targetServer: targetServer,
                        targetKey: targetKey
                    })
                });

                const result = await response.json();
                if (result.success) {
                    statusDiv.innerText = action 
                        ? '🟢 Retransmisión ACTIVADA. Inicia transmisión en OBS.' 
                        : '🔴 Retransmisión DETENIDA.';
                    statusDiv.style.color = action ? '#22c55e' : '#ef4444';
                } else {
                    statusDiv.innerText = 'Error al cambiar el estado.';
                }
            } catch (error) {
                statusDiv.innerText = 'Error de conexión con el servidor.';
                statusDiv.style.color = '#ef4444';
            }
        }
    </script>
</body>
</html>
